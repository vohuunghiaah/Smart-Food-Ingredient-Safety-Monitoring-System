<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Cảnh báo Dị ứng Thực phẩm</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 950px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 25px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            font-size: 20px;
        }
        .video-box {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16/9;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .video-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .result-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        .label {
            font-size: 12px;
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }
        .value {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 500;
        }
        .ingredients-container {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2ecc71;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .ingredients-list {
            margin: 5px 0 0 0;
            padding: 0;
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
        }
        .ingredients-list li {
            padding: 8px 0;
            border-bottom: 1px dashed #e2e8f0;
            color: #34495e;
            font-size: 14px;
        }
        .ingredients-list li:last-child {
            border-bottom: none;
        }
        .status-bar {
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h2>Camera Quét Mã Vạch</h2>
        <div class="video-box">
            <img src="/video_feed" alt="Live Stream">
        </div>
        <div class="status-bar">Hệ thống đang tự động bắt mã (EAN13 / CODE128)</div>
    </div>

    <div class="result-box">
        <h2>Kết Quả Phân Tích</h2>

        <div class="info-card">
            <span class="label">Mã vạch quét được</span>
            <div class="value" id="res-barcode">Đang đợi quét sản phẩm...</div>
        </div>

        <div class="info-card">
            <span class="label">Tên sản phẩm</span>
            <div class="value" id="res-name">---</div>
        </div>

        <div class="info-card">
            <span class="label">Phân nhóm (Category)</span>
            <div class="value" id="res-category">---</div>
        </div>

        <div class="ingredients-container">
            <span class="label">Danh sách thành phần</span>
            <ul class="ingredients-list" id="res-ingredients">
                <li style="color: #bdc3c7; border: none;">Chưa có dữ liệu...</li>
            </ul>
        </div>
    </div>
</div>

<script>
    function checkNewData() {
        fetch('/get_data')
            .then(response => response.json())
            .then(data => {
                if (data.barcode) {
                    document.getElementById("res-barcode").innerText = data.barcode;
                    document.getElementById("res-name").innerText = data.name || "Không xác định";
                    document.getElementById("res-category").innerText = data.category || "Không xác định";

                    const ul = document.getElementById("res-ingredients");
                    ul.innerHTML = "";

                    if (data.ingredients && data.ingredients.length > 0) {
                        data.ingredients.forEach(function(ing) {
                            const li = document.createElement("li");
                            li.innerText = ing;
                            ul.appendChild(li);
                        });
                    } else {
                        ul.innerHTML = '<li style="color: #bdc3c7; border: none;">Không tìm thấy thành phần</li>';
                    }
                }
            })
            .catch(err => console.error(err));
    }

    setInterval(checkNewData, 1000);
</script>

</body>
</html>
